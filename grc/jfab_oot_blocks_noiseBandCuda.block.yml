id: jfab_oot_blocks_noiseBandCuda
label: Noise Band CUDA
category: '[jfab_oot_blocks]'
flags: [ python, cpp ]

parameters:
-   id: ampl
    label: Amplitude
    dtype: float
    default: '1.0'

-   id: seed
    label: Seed
    dtype: int
    default: '0'

outputs:
-   domain: stream
    dtype: complex

templates:
    imports: from gnuradio import jfab_oot_blocks
    make: jfab_oot_blocks.noiseBandCuda(${ampl}, ${seed})

cpp_templates:
    includes: ['#include <gnuradio/jfab_oot_blocks/noiseBandCuda.h>']
    declarations: 'jfab_oot_blocks::noiseBandCuda::sptr ${id};'
    make: 'this->${id} = jfab_oot_blocks::noiseBandCuda::make(${ampl}, ${seed});'

file_format: 1